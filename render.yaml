envVarGroups:
  - name: dubbclub-provider-settings
    envVars: []

databases:
  - name: dubbclub-db
    region: ohio
    plan: basic-256mb
    ipAllowList: []

services:
  - type: web
    name: dubbclub
    runtime: node
    region: ohio
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dubbclub-db
          property: connectionString
      - key: NODE_VERSION
        value: 24.14.0
      - key: STORE_PREVIEW_PASSWORD
        generateValue: true
      - fromGroup: dubbclub-provider-settings
  - type: cron
    name: dubbclub-jobs
    runtime: node
    region: ohio
    schedule: '*/2 * * * *'
    buildCommand: npm ci
    startCommand: npm run jobs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dubbclub-db
          property: connectionString
      - key: NODE_VERSION
        value: 24.14.0
      - fromGroup: dubbclub-provider-settings
